name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  test:
    name: Lint · Type-check · Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Python setup ────────────────────────────────────────────────────────
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # ── Install dependencies ────────────────────────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 mypy

      # ── Lint ────────────────────────────────────────────────────────────────
      - name: Lint with flake8
        run: |
          flake8 app/ --count --statistics

      # ── Type check ──────────────────────────────────────────────────────────
      - name: Type check with mypy
        run: |
          mypy app/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true   # warnings only until full type annotations are added

      # ── Tests with coverage ─────────────────────────────────────────────────
      - name: Run tests with coverage
        run: |
          pytest test/ -v --tb=short \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=70

      # ── Upload coverage report ───────────────────────────────────────────────
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ── Docker build check ───────────────────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build --target runtime -t intelliginet:ci .

      - name: Smoke test Docker image
        timeout-minutes: 2
        run: |
          docker run --rm \
            --entrypoint python \
            -e LOG_FORMAT=text \
            intelliginet:ci \
            -c "from app.config import settings; print('Config OK:', settings)"
